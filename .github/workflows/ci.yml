name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The latest patch of the Go series go.mod declares: go.mod pins the
      # language floor (1.26.0), not a toolchain, and an unpatched 1.26.0
      # standard library fails the vulnerability scan on its own.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: true

      # The pinned tool versions live in the Makefile, so CI and a developer
      # running `make tools` get the very same goimports, golangci-lint v2 and
      # govulncheck ($GOPATH/bin is added to PATH by setup-go).
      - name: Install tooling
        run: make tools

      # The exact gate developers run locally via the pre-commit hook:
      # fmt-check + vet + lint + test + tidy-check.
      - name: Quality gate (make precommit)
        run: make precommit

      # Extra signal the local gate skips for speed.
      - name: Tests under the race detector
        run: make test-race

      # Known vulnerabilities reachable from the module: a dependency advisory
      # is invisible to the unit tests and the linter.
      - name: Vulnerability scan
        run: make vuln
